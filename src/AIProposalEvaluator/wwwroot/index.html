<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Proposal Evaluation & Explainability Suite</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="frontend.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0B0F17; color: #FFF; font-family: sans-serif;">
            <div style="width: 50px; height: 50px; border: 4px solid rgba(99,102,241,0.2); border-top-color: #6366F1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <h3 style="margin-top: 1.5rem; font-weight: 600; font-size: 1.1rem; color: #818CF8;">Loading AI Proposal Evaluation Suite...</h3>
            <p style="font-size: 0.85rem; color: #9CA3AF; margin-top: 0.5rem;">Initializing WebAssembly runtime & ML decision support components</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script type="module" src="_framework/blazor.webassembly.js"></script>

    <script>
        // JS Helper for Blazor PDF file download
        window.downloadFileFromBytes = (filename, base64Content) => {
            const link = document.createElement('a');
            link.download = filename;
            link.href = "data:application/pdf;base64," + base64Content;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>

</html>
